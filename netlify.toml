[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Old Webflow category URLs -> new store category URLs
[[redirects]]
  from = "/category/bach"
  to = "/store/bach"
  status = 301
  force = true

[[redirects]]
  from = "/category/ceramic"
  to = "/store/ceramic"
  status = 301
  force = true

[[redirects]]
  from = "/category/oils"
  to = "/store/oils"
  status = 301
  force = true

# Webflow ecommerce paths that no longer exist (Snipcart is a modal)
[[redirects]]
  from = "/checkout"
  to = "/store"
  status = 301
  force = true

# original misspelled flora slug
[[redirects]]
  from = "/flora/levander"
  to = "/flora/lavender"
  status = 301
  force = true
